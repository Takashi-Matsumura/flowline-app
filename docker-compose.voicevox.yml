# 流れのプレビューの読み上げに使う VOICEVOX エンジン。
#
# 使い方:
#   docker context use colima
#   docker-compose -f docker-compose.voicevox.yml up -d
#   curl -s http://127.0.0.1:50021/version
#
# 既定はホストの 127.0.0.1 だけに公開する。npm run dev のアプリからも、
# docker-compose.yml のアプリ（host.docker.internal 経由）からも、これで届く。
#
# Apple Silicon でも cpu イメージに arm64 版がある。GPU（Metal）は使えないが、字幕 1 文なら CPU で十分速い。

# アプリ（docker-compose.yml）とは別のプロジェクトにする。名前を付けないと、どちらも
# フォルダ名の flowline-app になり、片方で --remove-orphans を付けるともう片方が消える。
name: flowline-voicevox

services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-0.25.2
    container_name: voicevox-engine
    restart: unless-stopped
    ports:
      - "${VOICEVOX_BIND:-127.0.0.1}:50021:50021"
